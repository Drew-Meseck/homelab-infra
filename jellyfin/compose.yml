# Jellyfin. Uses the Intel iGPU (/dev/dri) for hardware transcoding.
# The GTX 1050 is intentionally left free for other workloads.
services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.3   # verify latest 10.x patch before deploy
    restart: unless-stopped
    ports:
      # Direct access for LAN media clients (TVs, Fire TV, phone apps) at
      # http://<lxc-ip>:8096. Browser access still works via Caddy on the
      # `edge` network (http://jellyfin.home.lan) once LAN DNS exists.
      - "8096:8096"
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_ROOT:?set MEDIA_ROOT in jellyfin/.env}:/media:ro
    devices:
      # Only the Intel iGPU is passed into the LXC (as /dev/dri/renderD129 via
      # `dev0:` in /etc/pve/lxc/100.conf). The Nvidia GTX 1050 is left free.
      - /dev/dri:/dev/dri
    group_add:
      # Must match the GID owning the render node INSIDE the LXC — set by the
      # `dev0: ...,gid=993` passthrough (host `render` group is 993 on this box).
      - "993"
    networks:
      - edge

networks:
  edge:
    external: true
