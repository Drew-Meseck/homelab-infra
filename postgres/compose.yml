# Shared Postgres. One instance, one database + user per app.
# NOT on the `edge` network — it's never web-facing. Apps that need it
# join the `data` network and connect to host `postgres:5432`.
services:
  postgres:
    image: postgres:17-alpine       # verify latest 17.x patch before deploy
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in postgres/.env}
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - data
    # Uncomment ONLY to reach Postgres from LAN admin tools (pgAdmin, etc.).
    # Leave closed in normal operation.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  data:
    external: true
